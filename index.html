
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Audio Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Spatial Audio Mixer</h2>
  <p>Move the slider to change the sound position.</p>

  <audio id="voice" src="sample.m4a" controls loop></audio>

  <label for="distance">Distance: <span id="distanceValue">5</span></label>
  <input id="distance" type="range" min="1" max="20" value="5">

  <label for="pan">Left / Right: <span id="panValue">0</span></label>
  <input id="pan" type="range" min="-1" max="1" step="0.1" value="0">

  <button id="start">Enable Spatial Audio</button>

  <script src="script.js"></script>
</body>
</html>
